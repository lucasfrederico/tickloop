name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all artifacts
        run: mvn -B -q package -DskipTests

      - name: Stage jars (handles both -SNAPSHOT and release builds)
        id: stage
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          mkdir -p dist
          # Use shell glob to capture whatever maven actually produced:
          # tickloop-core-0.2.0.jar OR tickloop-core-0.2.0-SNAPSHOT.jar etc.
          stage() {
            local module="$1" name="$2"
            # Skip the "original-*" pre-shade jar that shade plugin leaves behind.
            local src
            src=$(ls "${module}"/target/${name}-*.jar 2>/dev/null | grep -v original- | head -1)
            if [ -z "$src" ]; then
              echo "::error::no jar found for ${name} under ${module}/target"
              return 1
            fi
            cp "$src" "dist/${name}-${VERSION}.jar"
            echo "staged: dist/${name}-${VERSION}.jar (from $src)"
          }
          stage tickloop-core                tickloop-core
          stage tickloop-spring-boot-starter tickloop-spring-boot-starter
          stage examples/echo-game           tickloop-example-echo-game
          ls -lh dist/
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: false  # we maintain release notes manually
          fail_on_unmatched_files: true
